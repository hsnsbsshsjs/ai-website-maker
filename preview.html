<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WebCraft AI — Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #09090b;
            color: white;
            overflow: hidden;
        }

        .toolbar {
            height: 64px;
            background: #151518;
            border-bottom: 1px solid #29292f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logo span {
            color: #8b5cf6;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            background: #242429;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #34343b;
        }

        .back {
            background: #8b5cf6;
        }

        .preview-area {
            width: 100%;
            height: calc(100vh - 64px);
            background: white;
        }

        #websitePreview {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
        }

        .error {
            height: calc(100vh - 64px);
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .error-box {
            max-width: 500px;
        }

        .error h2 {
            color: #ef4444;
        }

        @media (max-width: 600px) {

            .toolbar {
                height: 58px;
                padding: 0 10px;
            }

            .logo {
                font-size: 16px;
            }

            button {
                padding: 8px 10px;
                font-size: 12px;
            }

            .preview-area {
                height: calc(100vh - 58px);
            }
        }
    </style>
</head>

<body>

    <div class="toolbar">

        <div class="logo">
            ✨ WebCraft <span>AI</span>
        </div>

        <div class="buttons">

            <button class="back" onclick="goBack()">
                ← Edit
            </button>

            <button onclick="refreshPreview()">
                ↻
            </button>

            <button onclick="openFullscreen()">
                ⛶
            </button>

        </div>

    </div>

    <div class="preview-area">

        <iframe
            id="websitePreview"
            title="Generated Website Preview">
        </iframe>

    </div>

    <div class="error" id="error">

        <div class="error-box">

            <h2>⚠️ No Website Found</h2>

            <p>
                We couldn't find a generated website.
                Go back and generate one first.
            </p>

            <button class="back" onclick="goBack()">
                ← Create Website
            </button>

        </div>

    </div>

    <script>

        const iframe =
            document.getElementById("websitePreview");

        const error =
            document.getElementById("error");

        function loadWebsite() {

            const website =
                localStorage.getItem("generatedWebsite");

            if (!website) {

                iframe.style.display = "none";
                error.style.display = "flex";

                return;
            }

            iframe.style.display = "block";
            error.style.display = "none";

            iframe.srcdoc = website;
        }

        function refreshPreview() {
            loadWebsite();
        }

        function goBack() {
            window.location.href = "index.html";
        }

        function openFullscreen() {

            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            }
        }

        loadWebsite();

    </script>

</body>
</html>
