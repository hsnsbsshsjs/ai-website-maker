<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebCraft AI - Preview</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b10;
            color: white;
        }

        /* TOP BAR */

        .topbar {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            background: #111118;
            border-bottom: 1px solid #292932;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        .logo span {
            color: #9b5cff;
        }

        .top-buttons {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .back-btn {
            background: #22222b;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
        }

        .download-btn {
            background: #9b5cff;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
        }

        /* EDIT PANEL */

        .editor {
            padding: 18px;
            background: #111118;
            border-bottom: 1px solid #292932;
        }

        .editor-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .edit-row {
            display: flex;
            gap: 10px;
            max-width: 1000px;
            margin: auto;
        }

        #editPrompt {
            flex: 1;
            min-height: 50px;
            resize: vertical;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #34343e;
            background: #191920;
            color: white;
            outline: none;
            font-size: 15px;
        }

        #editPrompt:focus {
            border-color: #9b5cff;
        }

        #editBtn {
            background: #9b5cff;
            color: white;
            padding: 0 22px;
            border-radius: 12px;
            min-width: 140px;
        }

        #editBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* STATUS */

        #status {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            color: #bdbdc8;
            min-height: 40px;
        }

        /* PREVIEW */

        .preview-wrapper {
            background: #222;
            padding: 20px;
            min-height: calc(100vh - 190px);
        }

        .preview-container {
            background: white;
            width: 100%;
            max-width: 1400px;
            margin: auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        #websitePreview {
            width: 100%;
            height: 75vh;
            border: none;
            display: block;
            background: white;
        }

        /* EMPTY STATE */

        .empty {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .empty h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .empty p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .create-btn {
            background: #9b5cff;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .topbar {
                height: auto;
                padding: 14px;
                gap: 10px;
                flex-wrap: wrap;
            }

            .logo {
                font-size: 18px;
            }

            .top-buttons {
                width: 100%;
            }

            .top-buttons button {
                flex: 1;
            }

            .editor {
                padding: 14px;
            }

            .edit-row {
                flex-direction: column;
            }

            #editBtn {
                min-height: 50px;
            }

            .preview-wrapper {
                padding: 8px;
            }

            #websitePreview {
                height: 70vh;
            }
        }
    </style>
</head>

<body>

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="logo">
            ✨ WebCraft <span>AI</span>
        </div>

        <div class="top-buttons">

            <button
                class="back-btn"
                onclick="goBack()">
                ← Back
            </button>

            <button
                class="download-btn"
                onclick="downloadWebsite()">
                📥 Download
            </button>

        </div>

    </header>


    <!-- AI EDITOR -->

    <section class="editor">

        <div class="editor-title">
            ✏️ Edit your website with AI
        </div>

        <div class="edit-row">

            <textarea
                id="editPrompt"
                placeholder="Tell AI what you want to change...

Example:
Change the colors to green and white.
Add a WhatsApp button.
Make the hero section more attractive.
Add a pricing section."
            ></textarea>

            <button
                id="editBtn"
                onclick="editWebsite()">
                ✨ Edit Website
            </button>

        </div>

        <div id="status"></div>

    </section>


    <!-- WEBSITE PREVIEW -->

    <main class="preview-wrapper">

        <div
            id="emptyState"
            class="empty"
            style="display:none;">

            <h2>No website found</h2>

            <p>
                Generate a website first before opening the preview.
            </p>

            <button
                class="create-btn"
                onclick="goBack()">
                ✨ Create Website
            </button>

        </div>


        <div
            id="previewContainer"
            class="preview-container">

            <iframe
                id="websitePreview"
                title="Generated Website">
            </iframe>

        </div>

    </main>


    <script>

        const AI_URL =
            "https://ai-website-maker.lutaayacyrus76.workers.dev/";

        const preview =
            document.getElementById("websitePreview");

        const editPrompt =
            document.getElementById("editPrompt");

        const editBtn =
            document.getElementById("editBtn");

        const status =
            document.getElementById("status");

        const previewContainer =
            document.getElementById("previewContainer");

        const emptyState =
            document.getElementById("emptyState");


        /* LOAD GENERATED WEBSITE */

        let website =
            localStorage.getItem("generatedWebsite");


        if (!website) {

            previewContainer.style.display = "none";
            emptyState.style.display = "flex";

        } else {

            preview.srcdoc = website;

        }


        /* EDIT WEBSITE */

        async function editWebsite() {

            const instruction =
                editPrompt.value.trim();

            if (!instruction) {

                status.textContent =
                    "⚠️ Tell the AI what you want to change.";

                return;
            }


            if (!website) {

                status.textContent =
                    "❌ No website is available to edit.";

                return;
            }


            editBtn.disabled = true;

            editBtn.textContent =
                "✨ Editing...";

            status.textContent =
                "🧠 AI is updating your website...";


            try {

                const response =
                    await fetch(AI_URL, {

                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({

                            mode: "edit",

                            prompt: instruction,

                            website: website

                        })

                    });


                const data =
                    await response.json();


                if (!response.ok || !data.success) {

                    throw new Error(
                        data.error ||
                        "Website editing failed."
                    );

                }


                /* UPDATE WEBSITE */

                website =
                    data.website;


                /* SAVE UPDATED WEBSITE */

                localStorage.setItem(
                    "generatedWebsite",
                    website
                );


                localStorage.setItem(
                    "websitePrompt",
                    instruction
                );


                /* UPDATE PREVIEW */

                preview.srcdoc =
                    website;


                editPrompt.value = "";


                status.textContent =
                    "✅ Website updated successfully!";


            } catch (error) {

                console.error(error);

                status.textContent =
                    "❌ " + error.message;

            } finally {

                editBtn.disabled = false;

                editBtn.textContent =
                    "✨ Edit Website";

            }

        }


        /* DOWNLOAD WEBSITE */

        function downloadWebsite() {

            if (!website) {

                alert("No website available to download.");

                return;
            }


            const blob =
                new Blob(
                    [website],
                    {
                        type: "text/html"
                    }
                );


            const url =
                URL.createObjectURL(blob);


            const link =
                document.createElement("a");


            link.href = url;

            link.download =
                "webcraft-website.html";


            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            URL.revokeObjectURL(url);

        }


        /* BACK TO CREATOR */

        function goBack() {

            window.location.href =
                "index.html";

        }


        /* CTRL + ENTER TO EDIT */

        editPrompt.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.ctrlKey &&
                    event.key === "Enter"
                ) {

                    editWebsite();

                }

            }
        );

    </script>

</body>
    </html>
