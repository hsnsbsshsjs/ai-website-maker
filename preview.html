<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>WebCraft AI - Website Editor</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b10;
            color: white;
        }

        /* =========================================
           TOP BAR
        ========================================= */

        .topbar {
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: #111118;
            border-bottom: 1px solid #292932;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            white-space: nowrap;
        }

        .logo span {
            color: #9b5cff;
        }

        .top-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        button {
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.92;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .back-btn {
            background: #22222b;
            color: white;
            padding: 11px 15px;
            border-radius: 10px;
        }

        .download-btn {
            background: #9b5cff;
            color: white;
            padding: 11px 15px;
            border-radius: 10px;
        }

        .publish-btn {
            background: #16a34a;
            color: white;
            padding: 11px 16px;
            border-radius: 10px;
        }

        /* =========================================
           AI EDITOR
        ========================================= */

        .editor {
            padding: 18px;
            background: #111118;
            border-bottom: 1px solid #292932;
        }

        .editor-title {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .editor-subtitle {
            color: #9999a5;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .edit-row {
            display: flex;
            gap: 10px;
            max-width: 1100px;
            margin: auto;
        }

        #editPrompt {
            flex: 1;
            min-height: 52px;
            resize: vertical;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #34343e;
            background: #191920;
            color: white;
            outline: none;
            font-size: 15px;
        }

        #editPrompt:focus {
            border-color: #9b5cff;
        }

        #editBtn {
            background: #9b5cff;
            color: white;
            padding: 0 22px;
            border-radius: 12px;
            min-width: 150px;
        }

        /* =========================================
           STATUS
        ========================================= */

        #status {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            color: #bdbdc8;
            min-height: 38px;
        }

        /* =========================================
           PUBLISH RESULT
        ========================================= */

        .publish-result {
            display: none;
            max-width: 900px;
            margin: 0 auto 15px auto;
            padding: 15px;
            background: #102518;
            border: 1px solid #1f7a3a;
            border-radius: 12px;
        }

        .publish-title {
            font-weight: bold;
            margin-bottom: 8px;
        }

        .publish-link-row {
            display: flex;
            gap: 8px;
        }

        #publishedUrl {
            flex: 1;
            background: #07140b;
            color: #9df3b1;
            border: 1px solid #285d37;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            outline: none;
        }

        .copy-btn {
            background: #16a34a;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
        }

        .open-btn {
            background: #2563eb;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
        }

        /* =========================================
           PREVIEW
        ========================================= */

        .preview-wrapper {
            background: #222;
            padding: 20px;
            min-height: calc(100vh - 190px);
        }

        .preview-container {
            background: white;
            width: 100%;
            max-width: 1400px;
            margin: auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        #websitePreview {
            width: 100%;
            height: 75vh;
            border: none;
            display: block;
            background: white;
        }

        /* =========================================
           EMPTY STATE
        ========================================= */

        .empty {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .empty h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .empty p {
            color: #aaa;
            margin-bottom: 20px;
        }

        .create-btn {
            background: #9b5cff;
            color: white;
            padding: 13px 22px;
            border-radius: 10px;
        }

        /* =========================================
           LOADING OVERLAY
        ========================================= */

        .loading {
            position: fixed;
            inset: 0;
            background: rgba(5, 5, 8, 0.82);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
            text-align: center;
        }

        .loading-box {
            background: #17171e;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid #30303a;
            min-width: 220px;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid #33333c;
            border-top-color: #9b5cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .topbar {
                padding: 12px;
                align-items: flex-start;
                flex-direction: column;
                gap: 10px;
            }

            .logo {
                font-size: 18px;
            }

            .top-buttons {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(3, 1fr);
            }

            .top-buttons button {
                width: 100%;
                padding: 10px 5px;
                font-size: 12px;
            }

            .editor {
                padding: 14px;
            }

            .edit-row {
                flex-direction: column;
            }

            #editBtn {
                min-height: 50px;
                width: 100%;
            }

            .preview-wrapper {
                padding: 8px;
            }

            #websitePreview {
                height: 70vh;
            }

            .publish-link-row {
                flex-direction: column;
            }

            #publishedUrl {
                width: 100%;
            }

            .copy-btn,
            .open-btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <!-- =========================================
         TOP BAR
    ========================================= -->

    <header class="topbar">

        <div class="logo">
            ✨ WebCraft <span>AI</span>
        </div>

        <div class="top-buttons">

            <button
                class="back-btn"
                onclick="goBack()"
            >
                ← Back
            </button>

            <button
                class="download-btn"
                onclick="downloadWebsite()"
            >
                📥 Download
            </button>

            <button
                id="publishBtn"
                class="publish-btn"
                onclick="publishWebsite()"
            >
                🚀 Publish
            </button>

        </div>

    </header>


    <!-- =========================================
         AI EDITOR
    ========================================= -->

    <section class="editor">

        <div class="editor-title">
            ✏️ Edit your website with AI
        </div>

        <div class="editor-subtitle">
            Tell WebCraft AI what you want to change.
        </div>

        <div class="edit-row">

            <textarea
                id="editPrompt"
                placeholder="Example:

Change the colors to blue and white.
Add a WhatsApp button.
Add a pricing section.
Make the hero section more attractive.
Change the business name."
            ></textarea>

            <button
                id="editBtn"
                onclick="editWebsite()"
            >
                ✨ Edit Website
            </button>

        </div>

        <div id="status"></div>


        <!-- PUBLISHED LINK -->

        <div
            id="publishResult"
            class="publish-result"
        >

            <div class="publish-title">
                🎉 Your website is live!
            </div>

            <div class="publish-link-row">

                <input
                    id="publishedUrl"
                    type="text"
                    readonly
                >

                <button
                    class="copy-btn"
                    onclick="copyPublishedUrl()"
                >
                    📋 Copy
                </button>

                <button
                    class="open-btn"
                    onclick="openPublishedWebsite()"
                >
                    🌐 Open
                </button>

            </div>

        </div>

    </section>


    <!-- =========================================
         PREVIEW
    ========================================= -->

    <main class="preview-wrapper">

        <div
            id="emptyState"
            class="empty"
            style="display:none;"
        >

            <h2>
                No website found
            </h2>

            <p>
                Generate a website first before opening the preview.
            </p>

            <button
                class="create-btn"
                onclick="goBack()"
            >
                ✨ Create Website
            </button>

        </div>


        <div
            id="previewContainer"
            class="preview-container"
        >

            <iframe
                id="websitePreview"
                title="Generated Website"
            ></iframe>

        </div>

    </main>


    <!-- =========================================
         LOADING
    ========================================= -->

    <div
        id="loading"
        class="loading"
    >

        <div class="loading-box">

            <div class="spinner"></div>

            <div id="loadingText">
                🧠 AI is working...
            </div>

        </div>

    </div>

         JAVASCRIPT
    ========================================= -->
