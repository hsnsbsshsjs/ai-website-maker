<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>WebCraft AI</title>  

<link rel="stylesheet" href="style.css">

</head>  <body>  <main class="container">  

    <div class="logo">✨ WebCraft AI</div>  

    <h1>  
        Build a website<br>  
        <span>with AI</span>  
    </h1>  

    <p class="subtitle">  
        Describe the website you want and let AI create it for you.  
    </p>  

    <div class="creator-box">  

        <textarea  
            id="prompt"  
            placeholder="Describe your website...

Example:
Create a modern barber shop website called Cyrus Cuts. Include services, prices, an about section, gallery and contact information."
></textarea>

<button id="generateBtn">  
            ✨ Generate Website  
        </button>  

    </div>  

    <div class="examples">  

        <p>Try an example:</p>  

        <button class="example"  
            onclick="useExample('Create a modern restaurant website with a menu, about section and contact information.')">  
            🍔 Restaurant  
        </button>  

        <button class="example"  
            onclick="useExample('Create a professional personal portfolio website for a web developer.')">  
            💻 Portfolio  
        </button>  

        <button class="example"  
            onclick="useExample('Create a beautiful school website with courses, teachers, news and contact information.')">  
            🎓 School  
        </button>  

    </div>  

    <div id="status"></div>  

</main>  

<script src="app.js"></script>

</body>  
</html>
